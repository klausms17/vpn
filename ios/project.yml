# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). CI generates
# ios/KlausVPN.xcodeproj from it; the project itself is never committed.
name: KlausVPN

options:
  bundleIdPrefix: com.klausms
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"       # CI: 1.0.<run>
    CURRENT_PROJECT_VERSION: "1"     # CI: <run>
    TARGETED_DEVICE_FAMILY: "1"      # iPhone only
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Manual          # CI signs Ad Hoc with explicit profiles

targets:
  KlausVPN:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.klausms.vpn
        PRODUCT_NAME: KlausVPN
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Klaus VPN
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true   # portrait only, so no split-screen layouts
        NSCameraUsageDescription: "Камера нужна, чтобы отсканировать QR-код с ключом или ссылкой на подписку."
        CFBundleURLTypes:
          - CFBundleURLName: com.klausms.vpn
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [klausvpn]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/KlausVPN.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.klausms.vpn]
    dependencies:
      - target: PacketTunnel
      - framework: Frameworks/Libxray.xcframework
        embed: false                 # a static framework: linked, not embedded
      - sdk: NetworkExtension.framework
      - sdk: libresolv.tbd           # Go's resolver on iOS

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes: ["Resources/geo"]  # added once below, as a folder
      - Shared
      - path: PacketTunnel/Resources/geo
        type: folder
        buildPhase: resources
        optional: true               # CI puts the trimmed databases here
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.klausms.vpn.tunnel
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: Klaus VPN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.klausms.vpn]
    dependencies:
      - framework: Frameworks/Libxray.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: libresolv.tbd

schemes:
  KlausVPN:
    build:
      targets:
        KlausVPN: all
        PacketTunnel: all
    archive:
      config: Release
